<!DOCTYPE html>
<!--
  LinkAce Tools: Bookmark Button — sidebar.html
  A production of The Ministry of Digital Affairs
  The add-link form, shared by popup mode and sidebar mode.
-->
<html>
<head>
<meta charset="utf-8">
<title>LinkAce</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    padding: 16px;
    width: 268px;
    box-sizing: border-box;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px 0;
    color: #89b4fa;
  }
  .field {
    margin-bottom: 10px;
  }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #a6adc8;
    margin-bottom: 4px;
  }
  .autocomplete {
    position: relative;
  }
  .autocomplete input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 9px;
    font-size: 13px;
    border: 1px solid #45475a;
    border-radius: 6px;
    background: #313244;
    color: #cdd6f4;
    font-family: inherit;
  }
  .autocomplete input[type="text"]:focus {
    outline: none;
    border-color: #89b4fa;
  }
  .suggestions {
    display: none;
    /* In-flow (not absolute) so the toolbar popup grows to fit the list
       instead of clipping it. */
    margin-top: 4px;
    background: #313244;
    border: 1px solid #45475a;
    border-radius: 6px;
    max-height: 168px;
    overflow-y: auto;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }
  .suggestions.open {
    display: block;
  }
  .suggestion-item {
    padding: 7px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  .suggestion-item.active {
    background: #45475a;
  }
  .suggestion-item strong {
    color: #89b4fa;
    font-weight: 700;
  }
  .suggestion-hint {
    padding: 6px 9px;
    font-size: 11px;
    font-style: italic;
    color: #a6adc8;
    border-top: 1px solid #45475a;
  }
  .suggestion-hint:first-child {
    border-top: none;
  }
  button#addBtn {
    width: 100%;
    margin-top: 4px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    color: #1e1e2e;
    background: #89b4fa;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button#addBtn:hover {
    background: #a6c1fb;
  }
  button#addBtn:active {
    background: #74a0f2;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #a6adc8;
    min-height: 16px;
  }
  #status.error {
    color: #f38ba8;
  }
  a#settingsLink {
    display: inline-block;
    margin-top: 14px;
    font-size: 11px;
    color: #89b4fa;
    text-decoration: none;
  }
  a#settingsLink:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <h1>LinkAce</h1>

  <div class="field">
    <label for="listsInput">Lists</label>
    <div class="autocomplete">
      <input type="text" id="listsInput" placeholder="Start typing to see your lists…" autocomplete="off" />
      <div class="suggestions" id="listsSuggestions"></div>
    </div>
  </div>

  <div class="field">
    <label for="tagsInput">Tags</label>
    <div class="autocomplete">
      <input type="text" id="tagsInput" placeholder="Start typing to see your tags…" autocomplete="off" />
      <div class="suggestions" id="tagsSuggestions"></div>
    </div>
  </div>

  <button id="addBtn">+ Add current page</button>
  <div id="status"></div>
  <a id="settingsLink" href="#">⚙ Settings</a>
  <script src="sidebar.js"></script>
</body>
</html>
